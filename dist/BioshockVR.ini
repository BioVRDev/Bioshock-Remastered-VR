; ============================================================================
;  BioshockVR.ini
;  Configuration for the BioShock Remastered VR mod.
; ----------------------------------------------------------------------------
;  WHERE THIS FILE GOES
;    Next to BioshockVR.dll, which is next to BioshockHD.exe. The mod finds this
;    file from its own module path, so a copy anywhere else is silently ignored.
;
;  HOW TO CHECK A SETTING ACTUALLY TOOK
;    BioshockVR.log appears beside this file and starts with a
;    "=== BioshockVR config ===" block echoing every value the mod read. If a
;    change is not in that echo, it did not take. Check there before concluding
;    anything from what you see in the headset.
;
;  FORMATTING RULES -- these will bite you
;    1. Comments go on their OWN line, starting with ';'.
;       NEVER put a comment after a value. Windows does not strip trailing text,
;       so "MenuIndexCounts=1493;1095  ; note" reads the note as data.
;    2. A line starting with ';' is IGNORED COMPLETELY. To switch on a setting
;       that is commented out, delete the leading semicolon.
;    3. Environment variables are NOT expanded. Writing %APPDATA%\... is read as
;       a literal folder called "%APPDATA%" and will fail. Write the full path.
;    4. Unknown keys are ignored silently. A typo looks exactly like a working
;       setting. If something has no effect, check the spelling against the log
;       echo first.
; ============================================================================

[VR]

; ############################################################################
; #  OPTIONAL PATHS -- only if the mod cannot find your game                 #
; ############################################################################
;
; Both are OFF by default and usually unnecessary: Steam and Epic default
; locations are found automatically. To use one, DELETE the leading semicolon
; and write the FULL path -- %APPDATA% is not expanded here.
;
; To find your Bioshock.ini: press Win+R, paste  %APPDATA%  press Enter, then
; look for one of these folders:
;     BioshockHD\Bioshock\           (Steam)
;     Bioshock Epic HD\Bioshock\     (Epic)
;
; Full paths, with YourName replaced by your Windows username:
;   Steam: C:\Users\YourName\AppData\Roaming\BioshockHD\Bioshock\Bioshock.ini
;   Epic:  C:\Users\YourName\AppData\Roaming\Bioshock Epic HD\Bioshock\Bioshock.ini
;
;GameIniPath=

; Folder containing BioshockHD.exe. Only for unusual install locations.
;   Steam: C:\Program Files (x86)\Steam\steamapps\common\BioShock Remastered\Build\Final
;   Epic:  C:\Program Files\Epic Games\BioshockRemastered\Build\Final
;
;GameDirPath=

; ############################################################################
; #  ACCESSIBILITY AND COMFORT                                               #
; #                                                                          #
; #  Everything in this block exists to make the mod playable for more       #
; #  people. None of it changes what the game does -- only how it reaches    #
; #  you. If VR makes you unwell, start here before anything else.           #
; ############################################################################

; ---- TURNING ---------------------------------------------------------------
; Smooth turning is the single most common cause of motion sickness in VR,
; because your eyes report rotation your inner ear does not.
;
; SnapTurn=1 replaces it with instant jumps: the view is simply somewhere else
; on the next frame, with nothing in between for your eyes to track. There is
; no sliding, no easing, no animation.
;
; SnapTurnDegrees is how far each flick takes you. 30 is gentle and needs more
; flicks to turn around; 45 is the most common choice; 90 turns you a quarter
; circle at a time and is the least nauseating but hardest to aim with.
;
; Flick the stick and let it return to centre for each turn -- holding it over
; does NOT turn you continuously. That is deliberate: a held snap turn is just
; smooth turning with extra steps.
SnapTurn=0
SnapTurnDegrees=45

; ---- TURN SPEED ------------------------------------------------------------
; The game's own turn rate is nearly VERTICAL at the top of the stick: measured,
; 0.98 gives ~105 deg/s, 0.99 gives ~140, and 1.00 gives ~200. A 2% difference in
; how hard you push doubled the speed, which is why turning felt consistent while
; held and different every time you re-pushed.
;
; TurnAxisMax caps what the game is ever sent, so that cliff is unreachable and
; the same push always turns you at the same rate. 0.95 gives roughly 90-110
; deg/s. Raise toward 1.00 for the old top speed, lower for a gentler turn.
;
; TurnAxisExp shapes the rest of the range. 1.0 is linear; above 1.0 gives finer
; control near the centre.
; ---- WALKING DIRECTION -----------------------------------------------------
; The game applies its deadzone PER AXIS (0.225, in its own User.ini bindings).
; The mod rotates your movement stick to control which way you walk, and rotating
; moves magnitude between the two axes -- so the game's per-axis threshold then
; bends the direction, by up to ~11 degrees, and snaps you to a pure sidestep
; once the forward part gets small. That was the long-standing "walking a
; straight line while pointing sideways drifts you diagonally".
;
; StickPrecomp undoes it, so the game walks you where you actually asked.
; Turn it off only to compare against the old behaviour.
;
; GameStickDeadzone must match the game's own value. 0.225 is what BioShock
; Remastered ships; change it only if your User.ini says something else.
StickPrecomp=1
GameStickDeadzone=0.225

TurnAxisMax=0.95
TurnAxisExp=1.0

; The GAME's own turn sensitivity, which the mod writes into Bioshock.ini for
; you -- it is the in-game options slider, where 70 here is "7" there. The
; shipped default reads far too slow once the right stick is the only way to
; turn, especially under the TurnAxisMax cap above.
;
; SET THIS TO -1 to leave whatever you chose in the game's own options alone.
; The startup log reads the value back, so you can see what actually took.
GameTurnSpeed=70

; ---- MOVEMENT --------------------------------------------------------------
; WHO STEERS YOUR WALKING. This does not change who AIMS -- see HeadAimAlways
; below. You aim with your controller in all four of these.
;
;   0  NEITHER     Only the right stick turns you. Looking around and pointing
;                  your controller both leave your direction of travel alone.
;                  How a flat-screen shooter handles.
;
;   1  CONTROLLER  You walk where you POINT. Looking around never changes your
;                  direction of travel. Steadier if you like to look around
;                  while walking straight. The default.
;
;   2  HEAD        You walk where you LOOK. Pointing your controller does not
;                  steer you, so you can aim off to one side and keep walking
;                  forwards.
;
;   3  BOTH        Where you point AND where you look, added together. What the
;                  mod did for its whole life before these four existed. Be
;                  warned that the two stack: a 90-degree head turn while
;                  pointing 90 degrees the same way walks you backwards.
;
; THE NUMBERS CHANGED on 2026-08-11, when a fourth mode was added and aiming was
; split out. If you are copying a value from an older config: old 0 is now 2,
; old 1 is now 3, old 2 is now 1. The log prints the mode's NAME at startup --
; check that line rather than trusting the number.
;
; If this line is missing the mod works it out from the old AimSource and
; HeadRelativeMove settings, so an older config keeps behaving as it did.
MovementMode=1

; LEGACY. Only read when MovementMode is absent. Kept so old configs still work.
HeadRelativeMove=1

; ---- AIMING ----------------------------------------------------------------
; Aim with your HEAD instead of your controller. The crosshair, the shot and the
; view all follow where you look, and your controller stops aiming entirely.
;
; This is independent of MovementMode, so any of the four ways of walking can be
; combined with either way of aiming. It used to be welded to movement mode 0,
; which meant head aim forced head steering and vice versa.
HeadAimAlways=0

; ---- CONSOLE EXPERIMENTS ---------------------------------------------------
; ExecCommand1..8 run once at startup, in order, through the game's own console.
; Empty entries are skipped, so gaps in the numbering are fine. The exact string
; is echoed into the log, which is how a typo shows up as something other than a
; silent no-op.
;
; An EXPERIMENT CHANNEL, not a feature. It exists so a question about the game's
; own behaviour can be answered by editing one line instead of by a rebuild.
; Anything that earns a permanent home gets its own setting.
;
; Off by default. Example:
;ExecCommand1=set Wrench ShowHitBox True

; Removes the game's walking head bob. The camera bobbing up and down while
; your real head does not is a strong nausea trigger. Recommended ON.
DisableHeadBob=1

; ---- CUTSCENES -------------------------------------------------------------
; 1 = cutscenes play on a flat screen fixed in the room, so a scripted camera
; cannot move your head for you. 0 = cutscenes play in full VR.
;
; Scripted camera motion is the other big nausea trigger, because you have no
; control over it at all. If cutscenes make you unwell, set this to 1.
CutsceneTheater=1

; ---- HEIGHT ----------------------------------------------------------------
; Height of the camera above the game's own eye point, in cm, + is up.
; The pawn's eye height was authored for a monitor and reads short in VR.
; Raise if you feel too short; lower if you feel like you are floating.
CameraHeightOffset=9

; ---- PHYSICAL WRENCH -------------------------------------------------------
; 1 = swing your arm to attack with the wrench. 0 = trigger only.
; Turn this OFF if you have limited shoulder mobility, limited play space, or
; if repeated swinging is uncomfortable. The trigger always works either way.
SwingEnabled=1

; ---- PAUSING ---------------------------------------------------------------
; Hold X and Y together to pause.
;
; On many setups NO menu button reaches the game: SteamVR claims the left one
; for its dashboard and the Meta runtime claims the right one. Without this
; chord those players cannot pause at all.
;
; MODIFIER + X + Y is "WHAT IS THIS?" -- hold it for half a second to reach
; the MAP. The modifier is whatever ControllerDpadModifier is set to.
;
; Jump stays on its normal button. Y is only ignored while X is already held,
; so a lone Y press still jumps and still speeds up the hacking mini-game.
; R3 also jumps, as a backup.
ControllerPauseChord=1

; Set to 0 if you deliberately launch the game in the background.
ForceWindowFocus=1

; ---- CONTROLLER REACH ------------------------------------------------------
; Which control acts as the d-pad modifier:
;   0 = off                      1 = right thumbrest (capacitive touch)
;   2 = right stick click        3 = left grip
;   4 = left thumbrest
;
; RIFT owners MUST use 2 -- those controllers have no
; thumbrest sensor at all, so modes 1 and 4 can never fire for them.
ControllerDpadModifier=1

; 0 = right thumbrest modifier + LEFT stick. Walking stops while held.
; 1 = LEFT thumbrest modifier + RIGHT stick. Walking never stops, turning is
;     suspended instead. Easier if you find yourself stopping dead every time
;     you check the map.
ControllerDpadFlip=0

; Fraction of stick travel ignored around centre, 0.0 to 1.0. Raise it if a
; worn stick drifts and you creep forward when you let go.
ControllerDeadzone=0.15

; Index grips read high from a RESTING hand, which leaves LB/RB permanently
; held and eats your face buttons. Raise to 0.90 if that happens to you.
GripThreshold=0.80
GripHysteresis=0.15

; ---- KEYBOARD --------------------------------------------------------------
; MEASURED 2026-08-09: hotkeys are COMPILED IN and cannot currently be rebound.
; This section used to promise a [KEYS] section at the bottom of the file. There
; has never been one, and there is no code to read it either -- Core/Keybinds.cpp
; exists and looks complete, but Key_Init() has no caller anywhere, so every
; binding in it resolves to nothing. Adding a [KEYS] section without wiring that
; up would give you settings that silently do nothing, so the honest list is
; here instead. Rebinding needs a code fix, not a config one.
;
; NO NUMPAD? Then the grip tuning and the draw probes are out of reach for now.
; Everything in the first two groups below is reachable without one.
;
;   CAMERA
;     Numpad .     re-capture the seated origin (recenter)
;     Numpad +     cycle the head-aim field candidate
;
;   HUD PANEL PLACEMENT
;     Delete       cycle WIDTH -> DISTANCE -> PITCH -> YAW
;     F11 / F12    decrease / increase the selected parameter
;     Home         toggle the HUD redirect on and off live
;
;   WEAPON GRIP TUNING -- the six axis keys edit whichever mode is active
;     Numpad 9     cycle GUN POSITION -> GUN ROTATION -> CURSOR ->
;                        LEFT HAND POSITION -> LEFT HAND ROTATION -> back round
;     Numpad 7     cycle the step size
;     Numpad 8/2   forward / back      or pitch up / down
;     Numpad 6/4   right / left        or yaw right / left
;     Numpad 0/5   up / down           or roll right / left
;
;   DRAW-CALL PROBES -- debug
;     Numpad *     clear the collected draw table
;     Numpad 3     dump the draw table to the log
;     Numpad 1     toggle SuppressIndexCounts
;     Numpad -     next isolate candidate
;     Numpad /     isolate off
;     F3           dump one frame's render-target structure
;
;   MEMORY PROBES -- debug
;     PgUp         snapshot the watched float block
;     PgDn         diff against that snapshot
;     Delete       console GET probe
;     F1           log a MARK line -- pins a moment in the headset to the log
;     F2           re-run the myHUD offset probe
;
; SHARED KEYS. These are real collisions in the shipped build: one press runs
; every listed handler, so expect extra log noise rather than one clean action.
;     Delete       HUD panel cycle + console GET probe
;     PgUp         grip mode cycle + grip snapshot + float snapshot
;     PgDn         grip diff + float diff
;
; Numpad 9 used to be on this list -- grip mode cycle AND draw frame dump, so a
; key pressed constantly during tuning also wrote ~400 lines to disk each time.
; The dump moved to F3, 2026-08-10.


; ############################################################################
; #  START HERE -- the settings most people actually need                    #
; ############################################################################

; ---- 1. Resolution and field of view ---------------------------------------
; THE MAIN PERFORMANCE DIAL. Lower ResolutionX/Y if you are dropping frames,
; then RE-RUN FirstTimeSetup.bat -- the game only picks these up from its own
; config, which that script writes.
; 2750x2850 at FOV 100 is a good balance: lowering FOV below 100 looks nearly
; identical in the headset but runs noticeably better, because the game stops
; rendering side content that never reaches the display.
;
; GameFovDegrees MUST match the game's HorizontalFOV -- SyncGameIni below keeps
; them in step automatically. Do not set the game's FOV by hand.
GameFovDegrees=100
ResolutionX=2750
ResolutionY=2850

; Anisotropic filtering, written into the game's config by FirstTimeSetup.bat.
; x16 is effectively free on any GPU that can run this in VR and sharpens
; floors and long corridors noticeably.
Anisotropy=16

; ---- 2. Your body ----------------------------------------------------------
; EyeSeparation is HALF your IPD in centimetres. 3.2 = 64 mm IPD, which is
; about average. If the world feels like a doll's house, lower it; if it feels
; gigantic, raise it. Small changes matter: try 0.1 at a time.
EyeSeparation=3.2

; ---- 3. Comfort ------------------------------------------------------------
; Removes the game's walking head bob. Recommended on.
DisableHeadBob=1

; ---- 4. The HUD ------------------------------------------------------------
; The interface is lifted off the game image and placed on its own panel.
;
; HudWidthDeg IS THE SIZE CONTROL. Lower pulls health and ammo in toward the
; centre and makes them smaller; raise pushes them out toward the edges. Tune it
; live in the headset with F11 (smaller) and F12 (larger) -- every press logs a
; line you can paste back here. HudDistance does NOT change apparent size.
;
; KNOWN ISSUE: the health and EVE bars render incorrectly on the panel. If it
; bothers you, HudRedirect=0 puts the whole interface back on the game image
; the old way. Nothing else is affected either way.
HudRedirect=1
HudWidthDeg=60
HudDistance=2.0
HudPitchDeg=0
HudYawDeg=0

; Menu and cutscene screen: size in metres, distance in metres.
MenuScreenSize=1.5
MenuScreenDistance=1.75

; ---- 5. Hands and weapons --------------------------------------------------
; Hides the forearms while keeping the hands and the gun. The arms are animated
; by the game while the hands follow your controllers, so they stretch oddly.
HideArmSleeves=1

; Removes the game's flat 2D crosshair and uses a proper VR dot instead.
;
; The dot hides itself when you are not holding anything and during scripted
; scenes, so it does not float in front of the opening of the game or over a
; cutscene.
DisableReticle=1
EnableCrosshair=1

; With nothing equipped there is no dot, so nothing shows where your controller
; is pointing -- look at a thing to pick it up instead. Only affects what you
; are aiming at, never the view, and never during scripted scenes.
HeadAimWhenUnarmed=1
CrosshairSize=0.024
CrosshairDistance=6.0

; 1 = the dot uses the exact aim direction written into the game, including the
; clamp and smoothing. 0 = the old behaviour, where the dot rebuilt the aim
; itself on the render thread and could drift from the shot.
; Your CursorOffsetN values work the same either way.
CrosshairFromShot=1

; If a weapon sits wrong in your hand, see PER-WEAPON GRIP further down. It can
; be tuned live with the numpad and saves itself back to this file.

; ---- 6. Controllers --------------------------------------------------------
; Index grips read high from a resting hand, which leaves LB/RB permanently
; held and eats your face buttons. Raise GripThreshold to 0.90 if that still
; happens to you. GripHysteresis is how far below it you must release.
GripThreshold=0.80
GripHysteresis=0.15

; 1 = walking follows where you LOOK. 0 = walking follows the pawn's facing.
HeadRelativeMove=1



; ############################################################################
; #  EVERYTHING BELOW IS TUNED AND WORKING. You can ignore it.               #
; ############################################################################


; ============================================================================
;  CORE
; ============================================================================

Fullscreen=0
SwapEyes=0
DisableVSync=1
SyncGameIni=1

; Desktop mirror. 0 = never. The headset image is copied before the present, so
; the desktop copy is pure cost and the only thing the compositor can throttle.
MirrorPresentEvery=0


; ============================================================================
;  CAMERA
; ============================================================================

EnableCameraHook=1
EnableCameraWrite=1
EnableHeadTracking=1
EnableHeadPosition=1
EnableHeadRoll=1
EnableHeadAim=1

; 2 = pitch-decoupled: all pitch comes from your head, horizon stays level.
;   0 = legacy additive (has a turn-warp artifact, kept only to compare)
;   1 = local compose, keeps mouse pitch (horizon tilts with it)
HeadAimMode=2

; Render both eyes of a pair from the same instant. Off = ~4.2 ms of world
; motion between the eye images, which near geometry cannot fuse.
PairLockCamera=1

; One world advance per eye PAIR instead of per eye.
;   0 off / 1 player world only / 2 BOTH delta-receiving worlds
DeltaClamp=2


; ============================================================================
;  WEAPON & ARM RENDERING
; ============================================================================

; ForegroundFovValue is a PROJECTION value derived from buffer aspect:
;   ForegroundFov = 2*atan( tan(GameFovDegrees/2) / (W/H) * 1.3333 )
; At 2750x2850 / FOV 100 that is 117.5. The field's native game value is 60, so
; it is NOT in the same units as HorizontalFOV -- do not try to match them.
; Auto=1 recomputes it from the real backbuffer every launch, so the number
; below is only a fallback.
ForegroundFovOffset=0x460
ForegroundFovAuto=1
ForegroundFovValue=117.5

HandsScale=0.8
GunScale=0.8
GunPtrOffset=0x45C
GunPtrBase=1
GunChildren=2

; World FOV guard. A vita chamber respawn drives this field to 139.9 and the
; value is SAVED with the game, so it survives a reload. Cutscenes drive it the
; other way, down to 60, which reads as a zoom. Anything outside the window
; snaps back to WorldFovValue.
WorldFovOffset=0x45C
WorldFovOffset2=0x648
WorldFovMax=120
WorldFovMin=70
WorldFovValue=75

; ---- cutscene bars ----
; Removes the letterbox bars during cutscenes. The vertex count is the
; fingerprint -- do not change it unless the log stops finding the draw.
HideCutsceneBars=1
CutsceneBarVertices=29
FreezeGameRotation=1
ModYaw=0
ModYawSpeed=90

; ---- inactive hand ----
; Collapses whichever hand is not in use. Bone 43 is moved rather than
; scaled; zeroing it flings the weapon through the near plane.
HideInactiveHand=1

; Per-weapon override. Slots: 0 wrench, 1 pistol, 2 shotgun, 3 crossbow,
; 4 grenade launcher, 5 machine gun, 6 chemical thrower, 7 camera, 8 plasmid.
; Any slot without a key here follows HideInactiveHand above.
; The shotgun and machine gun read better with both hands visible.
HideInactiveHand2=0
HideInactiveHand5=0

; ---- wrench swinging ----
; A fast hand motion fires the wrench. Velocity is measured RELATIVE TO YOUR
; HEAD, so walking and elevators do not count as swings.
; SwingThreshold too low = it fires while you gesture. Too high = you have to
; swing unnaturally hard. 3.6 m/s is the tuned starting point.
; SwingRearm must stay well below SwingThreshold or the return stroke
; double-hits.
SwingEnabled=1
SwingThreshold=2.0
SwingRearm=1.5
SwingCooldownMs=180
SwingPulseMs=120
SwingDelayMs=0
SwingLog=1
PitchServo=0

; A swing must be moving AWAY from your body, not just moving fast -- otherwise
; the wind-up fires the attack and the hit lands wherever your hand has swung
; to by then. 0.6 = 60% of the speed must be outward. Lower it if swings are
; being missed; raise it if wind-ups still trigger.
SwingOutwardFraction=0.60
; Metres the hand must travel from rest before a swing counts. Rejects flicks.
SwingTravelMetres=0.15

; ============================================================================
;  6-DOF HANDS
; ============================================================================

Enable6DofHands=1
EnableHandsProbe=1
HandsPtrOffset=0x724
HandsPosOffset=0x1D8

; Diagnostic. Dumps a handful of hand-rig bones to the log a few times after the
; skeleton locks, then stops on its own. It only READS -- nothing moves and
; nothing looks different in the headset. Leave it off unless you are asked for
; the numbers.
HandRigProbe=0

; Diagnostic, read-only. Logs which named Flash movie the interface has on top,
; and only when it changes. Nothing is called and nothing looks different in the
; headset -- it is on by default because the log line is how the mod's HUD
; placement and cutscene handling get diagnosed.
FlashGuiProbe=1

; Diagnostics, read-only, silent until the thing they measure happens. Neither
; changes what you see in the headset.
;
; TurnRateProbe    -- how fast the game actually turned you, while the right
;                     stick is pushed.
; ScriptedRotProbe -- during a scripted scene, which rotation field is moving.
TurnRateProbe=1
ScriptedRotProbe=1

; Scripted scenes normally turn you by rotating the field the mod follows. The
; balcony fall does not -- measured, it puts almost nothing there, while the
; Little Sister scene (which turns you correctly) does. This follows the game's
; own camera during a scripted scene instead. CONFIRMED in a headset on
; 2026-08-11 -- "the rotation has been fixed" -- and on by default since.
ScriptedCameraFollow=1

; During a scripted scene you can still turn yourself with the right stick. The
; scene's own rotation then lands on TOP of wherever you turned to, so a scene
; that means to face you at something faces you at something-plus-your-offset.
;
; This tracks how much YOU turned and hands it back to the scene as it rotates,
; so it reaches the view it was authored for.
;
;   0  off       the scene's rotation lands on top of your own turning
;   1  wash out  cancelled gradually as the scene turns -- you will not see it
;                happen, because the view is already moving. If the scene never
;                turns you, your own turning is left completely alone.
;   2  drop it   your turning goes the instant the scene rotates. Exact, but it
;                lands as a visible jerk.
;
; Your head is never affected by any of these -- the view always follows your
; neck 1:1. Only stick and snap turning are handed back.
ScriptedRecentre=0

; ---- WALK DRIFT -------------------------------------------------------------
; WalkDriftProbe is read-only: while you are actually moving it logs the
; direction you TRAVELLED, from your own position, against the direction the
; movement mode promised. Nothing looks different; it only writes to the log.
;
; It now logs the angle the mod SENT the game against the angle the game
; RECEIVED, so a mismatch names the problem instead of leaving it to be
; inferred from where you ended up.
WalkDriftProbe=1

; Diagnostic for per-plasmid tuning. Looks once for the game's list of plasmid
; types, then each time you SWITCH plasmid it works out which one you are
; holding and writes it to the log. Read-only -- nothing changes in the headset.
PlasmidProbe=1

; ---- A TRACKED FREE HAND ---------------------------------------------------
; Your free hand is normally hidden, because the game animates it from a
; shoulder that is not where yours is. This shows it instead and moves it to
; your own controller, so you have a real hand.
;
; It follows whichever hand is free: your LEFT while you hold a weapon, your
; RIGHT while you hold a plasmid.
;
;   0  off
;   1  it follows your controller but does not turn with it
;   2  it follows and turns
;   3  DIAGNOSTIC. Ignores your controller and slides the hand along one
;      direction at a time, three seconds each, so you can report which way it
;      went. Only needed if 1 moves the hand along the wrong axis.
;
; The two-handed weapons -- shotgun and Tommy gun -- are deliberately untouched,
; because both hands are already on the gun where they belong.
OffHandTracked=0


; ---------------------------------------------------------------------------
; The gun stops swaying
; ---------------------------------------------------------------------------
; The game plays a gentle idle animation on the hand holding your weapon, so the
; gun drifts and breathes even when your controller is perfectly still. In VR
; that reads as the gun being loose in your hand, and it is why the crosshair can
; never quite be trusted.
;
; 1 holds that hand at its own pose, so the gun goes rigid and sits exactly where
; you are pointing. Nothing else moves; the gun does not change position, size or
; angle, and shots go where they went before.
WeaponHandDrive=0

; What happens to the animations that were being suppressed.
;
;   0  the hand stays rigid. Reloads and idles do not play on it.
;   1  the game's animations play again -- reload, idle, the drill -- on a hand
;      that is still following your controller.
;
; Only does anything with WeaponHandDrive=1.
;
; NOTE: the idle sway IS one of those animations, so 1 brings some of it back by
; definition. The two settings below are what stop it bringing back ALL of it:
; anything smaller than HandAnimMinDeg is treated as breathing and stays rigid,
; anything larger is treated as a real animation and plays for HandAnimHoldMs.
; Raise the degrees if sway leaks through; lower it if reloads look cut short.
HandAnim=0
HandAnimMinDeg=5
HandAnimHoldMs=1200

; Per weapon slot, so recoil and reload can play on the guns while the WRENCH
; stays rigid. The wrench's swing animation fights a motion-controlled swing --
; the arc the game plays is not the arc your arm is making -- so slot 0 is off
; even when HandAnim above is on. Any slot without a line here follows HandAnim.
;HandAnimSlot0=0
;HandAnimSlot1=1
;HandAnimSlot2=1

; Whether the GUN is held rigid along with the hand.
;
; The gun hangs off one bone that the hand freeze does not otherwise touch, so
; with this off the hand goes still and the gun keeps swaying inside it -- which
; looks worse than leaving both alone. Measured: that bone drifts 1-5 degrees at
; rest and swings past 130 during a weapon switch.
;
; If the gun disappears, stretches across the screen, or the game locks up when
; you drop something with telekinesis, set this to 0 and relaunch. That is the
; one thing in this feature on an untested path.
WeaponHandBone43Rot=1

; When you switch weapons the game plays a draw animation, and the hand is left
; alone until it finishes. The mod waits for the rig to actually STOP MOVING
; rather than counting milliseconds, so a slow draw is waited for and a fast one
; is picked up immediately.
;
; This value is the CEILING -- the longest it will ever wait before giving up and
; locking anyway. Raise it if a weapon still locks mid-draw. It was a fixed 600
; and the wrench, whose draw runs longer, sometimes froze part-way through it.
WeaponSwitchSettleMs=1500


; ---------------------------------------------------------------------------
; Left-handed mode
; ---------------------------------------------------------------------------
; Puts the gun in your left hand and plasmids in your right. Fire, both radial
; menus, the sticks, the stick clicks and the d-pad modifier all move with it.
;
; NEEDS A FULL GAME RESTART, not a level reload -- the controller bindings are
; sent once when the headset session is created. The startup log says which mode
; is live; check that before deciding it did not work.
;
; The pause button does not move. On Touch controllers there is only one, and it
; is on the left controller.
;
; The hand holding the gun is still a right hand -- thumb on the far side. This
; setting moves the CONTROLS; making the model match is a later piece of work.
LeftHanded=0

; 0 keeps walking on the physical left stick even in left-handed mode, for anyone
; who wants the gun swapped but the movement where it already was.
LeftHandedSwapSticks=1


; ---------------------------------------------------------------------------
; Holding a two-handed weapon with both hands
; ---------------------------------------------------------------------------
; On the shotgun and the Tommy gun the game already draws your other hand on the
; fore-end. Bring your real hand to it and squeeze the grip, and the weapon is
; held against both hands.
;
; While you are NOT holding it, that hand follows your controller so you can
; reach for the gun. While you ARE, it sits where the game drew it.
;
; The grip button also opens the plasmid radial. It still does -- except when
; your hand is at the fore-end, because you do not need the plasmid wheel while
; you are reaching for the gun you are already holding.
TwoHandGrip=0

; How close your hand has to get, in cm, and how far it has to go to let go.
; Release is deliberately larger than grab so a hand resting near the edge does
; not flicker between the two.
TwoHandGrabRadius=12
TwoHandReleaseRadius=20

; 0 = hold the grip to keep hold of the weapon. 1 = press once to grab, again to
; let go.
TwoHandToggle=0

;
; WARNING, AND WHY THIS IS OFF: the plasmid wheel IS how you switch plasmids, so
; turning this on removes plasmid access entirely while a two-handed weapon is
; equipped. It was shipped on once and that is exactly what happened.
;
; Leave it at 0. Near-misses opening the wheel are handled by the grab radius
; instead -- your hand is inside the zone when you are reaching for the gun, and
; the wheel is suppressed there anyway. Only set this to 1 if you have bound
; plasmid switching somewhere else and want the grip reserved outright.
TwoHandBlockRadial=0


; ---------------------------------------------------------------------------
; Rumble
; ---------------------------------------------------------------------------
; A steady buzz in your off hand for as long as it is close enough to grab the
; fore-end. You cannot SEE the grab point -- while you are reaching, that hand is
; following your controller, so nothing is drawn there -- and feeling it is
; better than guessing.
;
; It is re-fired on a short interval rather than held on, because a rumble pulse
; is one-shot. HapticGrabEveryMs must stay SHORTER than HapticGrabMs or it
; stutters instead of feeling continuous.
HapticGrabZone=1
HapticGrabMs=60
HapticGrabEveryMs=50
HapticGrabAmp=0.35

; A kick in your weapon hand when the gun fires.
;
; It watches the game's own RECOIL ANIMATION rather than your trigger, so it only
; fires when the gun really does -- no kick on a dry click, no kick while
; reloading, and an automatic weapon rattles at its own rate rather than a rate we
; guessed. Needs WeaponHandDrive=1, because the movement it watches is only
; measured on a hand the mod is driving.
;
; HapticRecoilMinDeg is how much the wrist has to move to count as a shot. Raise
; it if you feel kicks during animations that are not shots; lower it if a
; light weapon does not register.
HapticRecoil=1
HapticRecoilMinDeg=6
HapticRecoilMs=45
HapticRecoilAmp=1.0

; Logs how far your off hand is from the fore-end, twice a second. Harmless, and
; it is how you find out whether the radii above suit your arms.
TwoHandProbe=1

; Which weapon slots can be held two-handed. 2 is the shotgun and 5 the Tommy
; gun -- the two the game itself animates with both hands.
;TwoHandable2=1
;TwoHandable5=1


; Which way round the hand model's axes are. Only touch this if OffHandTracked=1
; moves the hand along the wrong axis; mode 3 tells you what to put here.
LeftHandAxisMap=1,2,3

; Where each hand sits relative to your controller, and how it is angled.
; TUNE THESE LIVE -- Numpad 9 cycles to FREE HAND POSITION and FREE HAND
; ROTATION, and every change saves itself back here. The two hands are mirror
; images, so they get their own numbers; only one is ever free at a time.
;
; Offsets are forward, right, up in cm. Rotations are pitch, yaw, roll in
; degrees.
LeftHandOffset=0,0,0
LeftHandRot=0,0,0
RightHandOffset=0,0,0
RightHandRot=0,0,0

; CalcView calls before the probe arms, and between retries. If you ever get a
; crash on level load, RAISE HandsArmCalls FIRST.
HandsArmCalls=15
HandsRetryCalls=600

; Fallback for any weapon with no GripOffsetN of its own -- slots 3, 4, 6, 7.
; fwd,right,up in cm, in mesh space, so it scales with HandsScale.
HandsGripOffset=44,14.7,-13.0
HandsRotOffset=0,0,0

; Grip offsets do not carry across resolutions or FOVs by any reliable formula.
; This was measured and the scaling law was ruled out. 0 = use offsets exactly
; as written. Tune at the resolution you actually play at.
GripTunedFgFov=0


; ---- PER-WEAPON GRIP -------------------------------------------------------
; Slot order:
;   0 Wrench   1 Pistol   2 Shotgun   3 Crossbow   4 GrenadeLauncher
;   5 MachineGun   6 ChemicalThrower   7 ResearchCamera   8 Plasmid
;
; TUNE LIVE. Numpad 9 cycles what the six keys edit:
;   GUN POSITION   8/2 fwd    6/4 right  0/5 up    (cm)   -- where the gun sits
;   GUN ROTATION   8/2 pitch  6/4 yaw    0/5 roll  (deg)  -- how it is angled
;   CURSOR         8/2 pitch  6/4 yaw    0/5 roll  (deg)  -- where the shot goes
;   LEFT HAND POS  8/2 fwd    6/4 right  0/5 up    (cm)   -- LeftHandOffset
;   LEFT HAND ROT  8/2 pitch  6/4 yaw    0/5 roll  (deg)  -- LeftHandRot
; Numpad 7 cycles the step size. EVERY CHANGE SAVES ITSELF TO THIS FILE.
;
; The first three are PER WEAPON and save to the slot you are holding. The two
; left-hand modes are not -- one hand, one pair of values, whatever the right
; hand happens to be carrying.
;
; Order matters: point the gun with ROTATION first, then put the dot on it with
; CURSOR. To verify the cursor exactly, fire at a flat wall and adjust until the
; dot sits on the bullet hole -- the dot and the shot come from the same value,
; so that test is exact rather than a judgement call.
;
; If ">>> GRIP: numpad now edits ..." never appears in the log, the numpad is
; not reaching the game and you are tuning nothing.
;
; NOT YET TUNED: slots 3, 4, 6 and 7 (crossbow, grenade launcher, chemical
; thrower, research camera). They fall back to HandsGripOffset above and will
; sit wrong in your hand. Five minutes each with the numpad fixes it.
;
; Values below tuned at 2750x2850 / FOV 100. Expect to re-tune if you change
; either.

GripOffset0=58.0,18.3,-16.7
RotOffset0=-12.0,-16.0,-18.0
CursorOffset0=-15.00,-8.00,-11.00

GripOffset1=44.0,16.7,-15.4
RotOffset1=0.0,-8.0,0.0
CursorOffset1=2.0,-9.0,-4.0

GripOffset2=16.0,11.8,-11.8
RotOffset2=0.0,-8.0,0.0
CursorOffset2=0.0,-6.0,0.0

GripOffset5=52.0,17.0,-14.7
RotOffset5=3.0,0.0,-1.0
CursorOffset5=5.0,-2.0,-1.0

GripOffset8=52.00,-17.40,-21.80
RotOffset8=-67.00,-4.00,12.00
CursorOffset8=-9.00,3.00,0.00

; Slots 3, 4, 6, 7 inherit HandsGripOffset / HandsRotOffset above.


; ---- idle hands animation --------------------------------------------------
; The weapon sway IS the idle fidget: the weapon hangs off a bone of the hands
; mesh, so authored arm motion lands on the gun.
;   0  leave the game alone
;   1  every entry -> entry[0]. Kills the wrench slap, keeps one fidget.
;   2  every entry -> the off-screen pose. No motion, but the arms park off
;      screen -- only usable with HideArmsN=1.
;   3  DO NOT USE on the wrench: its equip animation is a one-shot draw, so
;      looping it replays the draw forever.
; There is no static hands animation in this game; every candidate is authored
; motion. Mode 1 is the least motion with arms visible.
IdleAnimMode=0
IdleAnimMode0=1


; ---- legacy per-slot arm suppression ---------------------------------------
; Superseded by HideArmSleeves above, which works at the skeleton and cannot
; take the weapon with it. Left in place because it costs nothing.
HideArms0=0
HideArms1=1
HideArms2=1
HideArms3=1
HideArms4=1
HideArms5=1
HideArms6=1
HideArms7=1
HideArms8=0


; ============================================================================
;  AIMING
; ============================================================================

; 1 = right controller. Required for motion aim and 6-DOF hands.
AimSource=1

; Max angle, per axis, between the aim ray and the view. Per-axis rather than a
; cone: a controller pointed near vertical has a meaningless yaw.
AimClampDeg=80

; 0 none .. 0.95 heavy. Smooths the aim OFFSET only, so head motion stays
; instant and only hand tremor is damped. Reaches the SHOT only, not the dot.
AimSmoothing=0

; deg added to the plasmid hand's aim pitch. Negative pulls the aim down.
PlasmidAimPitch=0


; ============================================================================
;  CONTROLLER
; ============================================================================

EnableController=1

; 0 = a real XInput pad in slot 0 takes priority and VR input is ignored.
; 1 = VR input replaces it. THIS IS THE DEFAULT and should stay that way:
; Virtual Desktop, Steam Input, ViGEm and any plugged-in pad all make slot 0
; report success, which silently kills every VR button and stick. Symptom is
; "I can aim with my hand but buttons do nothing".
ControllerMode=1

; 0 = literal Xbox (jump left-Y, use right-A), 1 = jump right-A.
ControllerLayout=0

; Stays 0. HeadAimMode=2 erases injected pitch and it reads as a fight.
ControllerPitch=0

ControllerDeadzone=0.15

; While held, the left stick stops moving you and works as a D-pad instead.
;   0 = off
;   1 = right thumbrest (capacitive touch)  -- Quest 3, Quest Pro, Index
;   2 = right stick click (R3)              -- USE THIS ON QUEST 1 / QUEST 2
;   3 = left grip

ControllerStickYToDpad=0
ControllerLog=1

; R3 jumps instead of zooming. Zoom is unusable in VR -- it drives a separate
; FOV field and breaks the weapon calibration. Additive: the layout's normal
; jump button still jumps. Ignored when ControllerDpadModifier=2.
JumpOnR3=1


; ============================================================================
;  MENUS
; ============================================================================

EnableMenuScreen=1
MenuScreenHeight=0

; Pause/weapon-select detection by draw signature.
MenuIndexCounts=1493;1095
MenuMaxIndexed=8

; SUPERSEDED by AnchorMovies below. This identified screens by counting draws,
; which false-fires during ordinary play. Leave it empty.
AnchorIndexCounts=

; ---- WHICH SCREENS SIT IN THE WORLD ----------------------------------------
; The game's whole interface is a stack of named Flash movies, and the mod reads
; which one is on top. Name a screen here and it is placed on the WORLD-LOCKED
; panel -- it stays put in the room while you look around, which is what a screen
; bound to a machine in front of you wants.
;
; ANYTHING NOT LISTED rides the HUD panel and scales with HudWidthDeg. That is
; what you want for the radial and for the equip screens, so leave those out.
;
; A listed screen is shown as the game's OWN PICTURE, so the mod stops lifting
; that screen's text and symbols onto the HUD panel while it is open -- otherwise
; they would be taken out of the picture you are being shown, which is what left
; the map's frame and tabs correct and the map itself blank. Your health and EVE
; bars come along in the same picture for those few seconds.
;
; Semicolon-separated, spaces are fine, and matching is loose and
; case-insensitive -- write `GeneBank` and it matches GeneBankPC.swf.
;
; MEASURED NAMES, seen live in one session (2026-08-11):
;   HUDRadial / HUDPC ... the HUD and the weapon/plasmid radial
;   PausePC ............. pause menu
;   Maps ................ the map screen
;   ingamemanual ........ the in-game manual
;   Hacking ............. the hacking minigame
;   craftingstation ..... U-Invent
;   Warning ............. confirmation prompts
;   PlasmiNow ........... plasmid acquired
;   PlasmidTrainingContainer ... plasmid tutorial video
;
; NOT YET SEEN, so the names below come from the game's own FlashMovies folder
; rather than from a log -- they should work, but they are unconfirmed:
;   GeneBankPC .......... the Gene Bank (tonic/plasmid equip)
;   PlasmidEquipStation . plasmid equip
;   InfoBoxContainer .... the "What is this?" context help
;
; Empty by default: nothing is anchored until you say so.
AnchorMovies=

; ---- SCREENS TO LEAVE ALONE ENTIRELY ---------------------------------------
; Some screens draw their text INTO panels that are part of the room -- the gene
; machines are the clearest case. The mod normally lifts that text onto the HUD
; panel in front of you, which can never line up with a panel bolted to a machine
; across the room, no matter what size you make it.
;
; Name such a screen here and the mod does not touch it: the game draws the text
; where it always did, on the panel.
;
; SIDE EFFECT, worth knowing before you wonder: while one of these screens is
; open your health and EVE bars are also left in the world instead of on the HUD
; panel. It lasts only as long as the screen is open.
;
; A NOTE ON HOW IT LOOKS: text left alone this way is drawn flat -- the same in
; both eyes -- so it may read as floating just in front of the panel rather than
; printed on it. If that bothers you more than the misplacement did, put the
; screen in AnchorMovies above instead, which always lines up because it shows
; the game's whole picture as one image.
;
; Same name rules as AnchorMovies. Empty by default.
SceneMovies=

; ---- SCREENS THAT FOLLOW YOUR HEAD -----------------------------------------
; Named here, a screen is shown the way the PAUSE MENU is -- the game's whole
; picture, panels and text together, as one image, so nothing can be out of place
; -- except that the panel follows where you look instead of staying where it was
; when you opened it.
;
; This is the one to use for machine screens like the gene machines and U-Invent,
; where the text belongs inside panels that are part of the room.
;
; MenuScreenSize is the size knob for these, not HudWidthDeg.
;
; As with AnchorMovies, the mod leaves a listed screen's text in the game's own
; picture rather than lifting it onto the HUD panel, so nothing goes missing from
; what you are shown.
;
; Same name rules as AnchorMovies. Empty by default.
FollowMovies=

; Read-only diagnostic. Logs full-screen textured passes with their viewport, so
; a screen effect that only covers part of your view can be identified by walking
; in and out of it. Costs a handful of log lines and changes nothing you see.
WaterProbe=1

; Alpha handling for the captured HUD. 1 is REQUIRED -- without it the captured
; panel has no usable alpha at all and is completely invisible.
HudAlphaFix=1

; Depth-stencil bound to the captured HUD draws.
;   0 = none        health/EVE bars show in full but slide sideways
;   1 = private     bars collapse to slivers
;   2 = the game's  behaved the same as 1 in testing
; None of the three is right yet -- this is the open HUD bug. 0 is the least
; wrong of them.
HudDsvMode=1


; ============================================================================
;  DEBUG / PROBE
;  Leave alone unless you are hunting an offset or a draw signature.
; ============================================================================

EnableDrawHook=1
EnableGameState=1

; M3-S1. Locates the engine's native property accessors and logs their
; addresses. Read-only and one-shot -- it calls nothing, hooks nothing and
; changes nothing you can see. Costs one brief stutter shortly after a level
; loads, then never runs again. Set to 0 to skip it entirely.
EnableNativeScan=1

; M7-S2. During a scripted hand animation the game is animating your hands on
; purpose, so the mod gets out of the way: the arms become visible, the hands
; stop following your controllers, and the mod stops steering -- the sequence
; walks you where it intended instead of where you were pointing. You can still
; look around freely with your head the whole time.
;
; Requires Enable6DofHands=1 to have any visible effect.
;
; It does NOT cover the Little Sister rescue or the EVE syringe -- those are
; handled by a different mechanism in the game and are not detected yet.
ScriptedEventQol=0

; Stops the game rotating your view during normal play: the screen shake when a
; building rumbles, weapon kick, and the subtle pan toward enemies. Your own
; turning is untouched, because it only applies while your stick is centred.
;
; Scripted events, bathysphere rides, and any moment the game is moving you into
; position are all excluded automatically, so those still turn you normally.
; Set to 0 if you would rather keep the shake.
FreezeGameplayRotation=1

; COMFORT. During a scripted event, should the game be allowed to turn you to
; face the action?
;   1  yes -- cutscenes point you at what you are meant to see (default)
;   0  no  -- the view holds still and you turn yourself with the right stick,
;             which works during scripted events. For people who find automatic
;             camera movement uncomfortable.
ScriptedRotationFollow=1

; How much hand movement counts as "an animation is playing", which is what
; decides whether your arms are shown during a scripted event. Lower shows them
; more readily. Leave this alone unless the arms flicker or never appear.
ScriptedHandsMotionThreshold=0.02

; How long your arms stay on screen after the animation stops moving them, in
; milliseconds. Some scenes hold a pose for seconds in the MIDDLE of an
; animation -- the plasmid injection does -- and without this your arms blink out
; for that pause. Raise it if arms disappear during a scene they should be in.
;
; The trade is at the other end: the Little Sister crawl is meant to show your
; arms for the bottle catch and then hide them, and a long hold delays that.
ScriptedHandsHoldMs=300

; How long the mod keeps treating a scripted scene as "still running" after the
; game says it has stopped, in milliseconds.
;
; This is a bug fix, not a comfort setting. One scene tells the mod about itself
; TWICE -- first while the game is walking you into position, then again while
; the scripted animation plays -- and those two announcements normally overlap.
; When they do not, there is a single frame in which the mod thinks the scene is
; over, takes back control of where you are pointing, and reads a heading that is
; not yet meaningful. That is what made the Little Sister crawl occasionally walk
; you off in the wrong direction. Holding the window across the gap closes it.
;
; 250 covers every gap measured so far with room to spare. 0 restores the old
; behaviour if you ever need to compare.
ScriptedWindowHoldMs=250

; Some scripted scenes let you WALK AROUND while they play -- the Big Daddy
; killing a splicer is one. The mod treats those like every other scripted
; scene and hands your aim back to the game, which leaves looking around unable
; to steer and moving feeling strange.
;
; 1 = a scripted scene with your health and EVE meters still up is treated as
;     one you are still playing, and you keep your aim.
;
; MEASURED, and on by default. In one run a locked cutscene ran 108 seconds with
; the meters hidden and the movement controls reading exactly zero, while the
; Big Daddy scene had the meters up and the controls swinging the whole time.
;
; DECIDED ONCE, in the first second of the scene, and then left alone until it
; ends. It used to be re-judged every frame, and a scene that moves you could
; flip to "you are in control" halfway through -- which handed your aim back
; while the game was still walking you, and threw the balcony fall metres off
; its mark. A scene that moves you is never treated as one you control.
;
; Turn this off to hand your aim back for the whole of EVERY scripted scene,
; which is what the mod did before this setting existed.
ControllableScriptedFix=1

; Diagnostic for the setting above -- prints, once a second during any scripted
; scene, which signals are true. Read-only, silent the rest of the time.
ScriptedWindowProbe=1

; M7-S1. Hunts for the flag the game sets during scripted events, by watching
; two small memory windows change. Read-only and changes nothing you can see --
; it only writes to the log. Unlike the scan above it samples continuously, so
; it ships OFF; turn it on only when you are deliberately running the probe.
EnableForcedMoveProbe=0

HookInstanced=0
SuppressIndexCounts=
IsolateCounts=
WeaponCounts=
HudCounts=

ArrowCounts=
ArrowScale=1.0
ArrowOffsetX=0.0
ArrowOffsetY=-0.30
GameIniPath=


; ============================================================================
;  BUILD-SPECIFIC ADDRESSES
;  ONLY touch these if the log says a vtable mismatch.
; ----------------------------------------------------------------------------
;  Two features use fixed addresses into the game executable rather than
;  scanning for what they need: the reticle removal and the arm hiding. Those
;  addresses are correct for the Steam build these were developed against.
;
;  On a different build they will not match. Both features VERIFY before writing
;  anything, so a mismatch is harmless -- the feature simply does nothing and the
;  log says so:
;
;      !!! exec: UGameEngine vtable mismatch
;      !!! ARMHIDE: AHands vtable mismatch
;
;  If you see either line, the simplest fix is to turn that feature off
;  (DisableReticle=0 or HideArmSleeves=0). Everything else in the mod finds its
;  targets by scanning and works regardless of build.
;
;  The defaults are compiled in; these keys exist only to override them without
;  rebuilding. Uncomment and edit only if you have found the right values.
; ============================================================================

;EnginePtrRva=0x1375368
;EngineVtableRva=0x00E0DFF4
;EngineExecRva=0x004C5970
;EngineExecThis=0x40


