;GripOffset2=16.0,12.0,-12.0
;RotOffset2=0.0,-3.0,0.0
;CursorOffset2=0.0,-1.0,0.0
;GripOffset5=52.0,16.0,-18.0
;RotOffset5=3.0,0.0,-1.0
;CursorOffset5=6.0,-2.0,-1.0
;GripOffset8=42.0,-14.0,-12.0
;RotOffset8=-28.0,7.0,0.0

; Offsets measured against the off-screen hands pose (IdleAnimMode=2). ONLY
; valid with that pose pinned; applying them with normal animations running puts
